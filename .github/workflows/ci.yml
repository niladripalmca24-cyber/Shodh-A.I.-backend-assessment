name: CI Pipeline & Automated Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-verify:
    name: Build, Migrate, Seed & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shodh_user
          POSTGRES_PASSWORD: shodh_password
          POSTGRES_DB: shodh_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        env:
          SYNC_DATABASE_URL: postgresql://shodh_user:shodh_password@localhost:5432/shodh_db
          DATABASE_URL: postgresql+asyncpg://shodh_user:shodh_password@localhost:5432/shodh_db
        run: |
          alembic upgrade head

      - name: Deterministic Database Seeding
        env:
          DATABASE_URL: postgresql+asyncpg://shodh_user:shodh_password@localhost:5432/shodh_db
        run: |
          python -m app.seed

      - name: Execute Automated Functional & Concurrency Tests
        env:
          DATABASE_URL: postgresql+asyncpg://shodh_user:shodh_password@localhost:5432/shodh_db
          TEST_DATABASE_URL: postgresql+asyncpg://shodh_user:shodh_password@localhost:5432/shodh_db
          RUNNER_MODE: MOCK
        run: |
          pytest -v -rA --tb=short

      - name: Execute Repeatable Workload Benchmark
        env:
          DATABASE_URL: postgresql+asyncpg://shodh_user:shodh_password@localhost:5432/shodh_db
          RUNNER_MODE: MOCK
        run: |
          python scripts/load_test.py

      - name: Verify OpenAPI 3.1 Specification Export
        run: |
          python scripts/export_openapi.py
